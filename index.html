<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Student Management - MVC + JDBC</title>
    <style>
        body { font-family: Arial, sans-serif; background:#f4f7fb; margin:0; }
        .box { width:420px; margin:70px auto; background:white; padding:30px;
               border-radius:14px; box-shadow:0 5px 20px #bbb; }
        h1 { text-align:center; }
        input { width:100%; padding:12px; margin:9px 0; box-sizing:border-box; }
        button { width:100%; padding:12px; margin-top:10px; border:0;
                 border-radius:7px; background:#2563eb; color:white; font-size:16px; }
        .note { text-align:center; color:#666; font-size:13px; }
    </style>
</head>
<body>
<div class="box">
    <h1>Student Management</h1>

    <form action="students" method="post">
        <input type="number" name="id" placeholder="Student ID" required>
        <input type="text" name="name" placeholder="Student Name" required>
        <input type="email" name="email" placeholder="Student Email" required>
        <button type="submit">Save Student</button>
    </form>

    <p class="note">Frontend → Controller → Model/DAO → JDBC → MySQL</p>
</div>
</body>
</html>
